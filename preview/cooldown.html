<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Cooldown</title><link rel="stylesheet" href="_preview.css"></head><body>
<div class="card" style="background: var(--vellum-night); align-items:center; justify-content:center;">
  <h3 class="card-title">Cooldown radial</h3>
  <div style="display:flex; gap:18px; padding-top:14px;">
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="position:relative; width:64px; height:64px; background:var(--vellum-base); border:2px solid var(--gold-pale);">
          <span style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:900; font-size:28px; color:var(--gold-pale);">ᚱ</span>
          <div style="position:absolute; inset:0; background: conic-gradient(rgba(0,0,0,0.7) 0% 0%, transparent 0% 100%); pointer-events:none;"></div>
        </div>
        <span class="sm-pixel" style="font-size:8px;">Ready</span>
      </div>
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="position:relative; width:64px; height:64px; background:var(--vellum-base); border:2px solid var(--arcane-mist);">
          <span style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:900; font-size:28px; color:var(--arcane-mist);">ᚱ</span>
          <div style="position:absolute; inset:0; background: conic-gradient(rgba(0,0,0,0.7) 0% 40%, transparent 40% 100%); pointer-events:none;"></div>
        </div>
        <span class="sm-pixel" style="font-size:8px;">60%</span>
      </div>
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="position:relative; width:64px; height:64px; background:var(--vellum-base); border:2px solid var(--vellum-light);">
          <span style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:900; font-size:28px; color:var(--vellum-light);">ᚱ</span>
          <div style="position:absolute; inset:0; background: conic-gradient(rgba(0,0,0,0.7) 0% 80%, transparent 80% 100%); pointer-events:none;"></div>
        </div>
        <span class="sm-pixel" style="font-size:8px;">20%</span>
      </div>
    
  </div>
</div></body></html>
