<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Radius</title><link rel="stylesheet" href="_preview.css"></head><body>
<div class="card">
  <h3 class="card-title">Cantos · quase tudo é 0</h3>
  <p class="card-sub">Pixel-art não arredonda. Pills ficam para tags.</p>
  <div class="grid-3" style="align-items:center;">
    <div style="background:var(--vellum-aged); border:2px solid var(--gold-pale); height:80px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px;">0px</div>
    <div style="background:var(--vellum-aged); border:2px solid var(--gold-pale); height:80px; border-radius:2px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px;">2px</div>
    <div style="background:var(--vellum-aged); border:2px solid var(--gold-pale); height:80px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px;">pill</div>
  </div>
</div></body></html>
