<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Spell Tile</title><link rel="stylesheet" href="_preview.css"></head><body>
<div class="card" style="background: var(--vellum-night); align-items:center; justify-content:center;">
  <h3 class="card-title">Spell Tile · hotbar</h3>
  <div style="display:flex; gap:8px; padding-top:12px;">
    
      <div style="position:relative; width:64px; height:64px; background:var(--vellum-base); border:2px solid var(--gold-bright); box-shadow: 0 3px 0 var(--ink-black), inset 0 1px 0 1px var(--vellum-light); display:flex; align-items:center; justify-content:center;">
        <span class="sm-rune" style="font-size:28px;">ᚠ</span>
        <span class="sm-pixel" style="position:absolute; top:3px; left:4px; font-size:8px; color:var(--gold-bright);">Q</span>
        <span class="sm-stat" style="position:absolute; bottom:2px; right:3px; font-size:9px; color:var(--mana-text);">10</span>
        
      </div>
    
      <div style="position:relative; width:64px; height:64px; background:var(--vellum-base); border:2px solid var(--gold-dim); box-shadow: 0 3px 0 var(--ink-black), inset 0 1px 0 1px var(--vellum-light); display:flex; align-items:center; justify-content:center;">
        <span class="sm-rune" style="font-size:28px;">ᚱ</span>
        <span class="sm-pixel" style="position:absolute; top:3px; left:4px; font-size:8px; color:var(--gold-bright);">W</span>
        <span class="sm-stat" style="position:absolute; bottom:2px; right:3px; font-size:9px; color:var(--mana-text);">16</span>
        
      </div>
    
      <div style="position:relative; width:64px; height:64px; background:var(--vellum-base); border:2px solid var(--gold-dim); box-shadow: 0 3px 0 var(--ink-black), inset 0 1px 0 1px var(--vellum-light); display:flex; align-items:center; justify-content:center;">
        <span class="sm-rune" style="font-size:28px;">ᛞ</span>
        <span class="sm-pixel" style="position:absolute; top:3px; left:4px; font-size:8px; color:var(--gold-bright);">E</span>
        <span class="sm-stat" style="position:absolute; bottom:2px; right:3px; font-size:9px; color:var(--mana-text);">22</span>
        <div style="position:absolute; inset:0; background: conic-gradient(rgba(0,0,0,0.7) 0% 35%, transparent 35% 100%); pointer-events:none;"></div>
      </div>
    
      <div style="position:relative; width:64px; height:64px; background:var(--vellum-base); border:2px solid var(--gold-dim); box-shadow: 0 3px 0 var(--ink-black), inset 0 1px 0 1px var(--vellum-light); display:flex; align-items:center; justify-content:center;">
        <span class="sm-rune" style="font-size:28px;">ᛒ</span>
        <span class="sm-pixel" style="position:absolute; top:3px; left:4px; font-size:8px; color:var(--gold-bright);">R</span>
        <span class="sm-stat" style="position:absolute; bottom:2px; right:3px; font-size:9px; color:var(--mana-text);">40</span>
        
      </div>
    
  </div>
</div></body></html>
