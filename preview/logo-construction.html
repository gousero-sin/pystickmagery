<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Logo Construction</title><link rel="stylesheet" href="_preview.css"></head><body>
<div class="card" style="background: var(--vellum-deep);">
  <h3 class="card-title">Construção</h3>
  <div style="flex:1; display:flex; align-items:center; justify-content:center; gap: 18px; padding: 12px 0;">
    <div style="position:relative;">
      <img src="../assets/logo-mark.svg" alt="" style="width: 160px; height: 160px;">
      <svg viewBox="0 0 200 200" style="position:absolute; inset:0; width:160px; height:160px;">
        <polygon points="100,8 178,52 178,148 100,192 22,148 22,52" fill="none" stroke="#c44141" stroke-width="0.8" stroke-dasharray="2 2"/>
        <circle cx="100" cy="100" r="80" fill="none" stroke="#c44141" stroke-width="0.5" stroke-dasharray="2 2"/>
        <line x1="100" y1="0" x2="100" y2="200" stroke="#c44141" stroke-width="0.5" stroke-dasharray="2 2"/>
        <line x1="0" y1="100" x2="200" y2="100" stroke="#c44141" stroke-width="0.5" stroke-dasharray="2 2"/>
      </svg>
    </div>
    <div style="font-family: var(--font-mono); font-size:11px; color: var(--fg-secondary); line-height: 1.8;">
      <div>Sigil: <span style="color:var(--gold-pale)">hex regular, 96u apótema</span></div>
      <div>Inner ring: <span style="color:var(--gold-pale)">hex tracejado, 4-3 dash</span></div>
      <div>Mage sprite: <span style="color:var(--gold-pale)">16×16 px (4u/cell)</span></div>
      <div>Staff: <span style="color:var(--gold-pale)">degraus diagonais 6×6</span></div>
      <div>Orb: <span style="color:var(--gold-pale)">20×20, 4 camadas</span></div>
    </div>
  </div>
</div></body></html>
