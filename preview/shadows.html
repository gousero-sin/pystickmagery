<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Shadows</title><link rel="stylesheet" href="_preview.css"></head><body>
<div class="card" style="background: var(--vellum-night);">
  <h3 class="card-title">Elevação · sombra dura + glow</h3>
  <div class="grid-3" style="align-items:center; justify-items:center; padding-top:20px;">
    <div style="background:var(--vellum-base); width:90px; height:60px; border:2px solid var(--gold-pale); box-shadow: 0 4px 0 rgba(0,0,0,0.55), 0 8px 24px rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px;">card</div>
    <div style="background:var(--vellum-base); width:90px; height:60px; border:2px solid var(--gold-bright); box-shadow: 0 6px 0 rgba(0,0,0,0.6), 0 0 18px rgba(201,161,74,0.45); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px;">rune</div>
    <div style="background:var(--vellum-base); width:90px; height:60px; border:2px solid var(--arcane-mist); box-shadow: 0 6px 0 rgba(0,0,0,0.6), 0 0 22px rgba(124,58,237,0.55); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px; color:var(--arcane-mist);">arcane</div>
  </div>
</div></body></html>
