<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>HP & Mana</title><link rel="stylesheet" href="_preview.css"></head><body>
<div class="card" style="background: var(--vellum-night); justify-content:center;">
  <h3 class="card-title">Barras vitais</h3>
  <div style="display:flex; flex-direction:column; gap:14px; padding-top:14px;">
    <div>
      <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
        <span class="sm-eyebrow" style="color:var(--hp-text)">HP</span>
        <span class="sm-stat" style="font-size:12px; color:var(--hp-text)">96 / 120</span>
      </div>
      <div class="sm-bar"><div class="sm-bar__fill" style="width:80%;"></div></div>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
        <span class="sm-eyebrow" style="color:var(--mana-text)">MANA</span>
        <span class="sm-stat" style="font-size:12px; color:var(--mana-text)">64 / 100</span>
      </div>
      <div class="sm-bar sm-bar--mana"><div class="sm-bar__fill" style="width:64%;"></div></div>
    </div>
  </div>
</div></body></html>
