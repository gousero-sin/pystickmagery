<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="_preview.css"></head><body>
<div class="card">
  <h3 class="card-title">Movimento · steps()</h3>
  <p class="card-sub">Pixel-art anima em quadros, não com easing suave.</p>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px;">
    <div class="token"><span class="token-name">ease-step-2</span><span class="token-val">flicker</span></div>
    <div class="token"><span class="token-name">ease-step-4</span><span class="token-val">hover, pulse</span></div>
    <div class="token"><span class="token-name">ease-step-8</span><span class="token-val">cast, load</span></div>
    <div class="token"><span class="token-name">dur-snap</span><span class="token-val">80ms</span></div>
    <div class="token"><span class="token-name">dur-fast</span><span class="token-val">160ms</span></div>
    <div class="token"><span class="token-name">dur-base</span><span class="token-val">240ms</span></div>
  </div>
</div></body></html>
