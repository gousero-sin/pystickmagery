<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Enemy Card</title><link rel="stylesheet" href="_preview.css"></head><body>
<div class="card" style="background: var(--vellum-night); align-items:center; justify-content:center;">
  <div class="sm-vellum" style="padding: 16px; width: 260px;">
    <div style="display:flex; gap:12px; align-items:flex-start;">
      <div style="width:48px; height:48px; background:var(--vellum-base); border:2px solid var(--school-fire); display:flex; align-items:center; justify-content:center;">
        <span class="sm-rune" style="font-size:24px; color:var(--school-fire);">ᚠ</span>
      </div>
      <div style="flex:1;">
        <div class="sm-eyebrow" style="color:var(--school-fire);">FIRE · DUELIST</div>
        <div class="sm-h3" style="font-size:16px; margin:2px 0 0 0;">Ember Duelist</div>
        <div class="sm-body-sm" style="margin:4px 0 0 0; font-size:12px; color:var(--fg-tertiary)">Sig: Duelist Ember Thrust</div>
      </div>
    </div>
    <div style="margin-top:10px;">
      <div class="sm-bar" style="height:10px;"><div class="sm-bar__fill" style="width:62%;"></div></div>
    </div>
  </div>
</div></body></html>
