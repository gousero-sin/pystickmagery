<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Toast</title><link rel="stylesheet" href="_preview.css"></head><body>
<div class="card" style="background: var(--vellum-night); align-items:center; justify-content:center; gap:12px;">
  <div class="sm-vellum" style="padding: 12px 16px; min-width: 260px; border-color: var(--good);">
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="sm-rune" style="color:var(--good-text); font-size:20px;">✓</span>
      <span class="sm-body-sm" style="color:var(--fg-primary);">Mago invocado com sucesso</span>
    </div>
  </div>
  <div class="sm-vellum" style="padding: 12px 16px; min-width: 260px; border-color: var(--bad);">
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="sm-rune" style="color:var(--bad-text); font-size:20px;">✗</span>
      <span class="sm-body-sm" style="color:var(--fg-primary);">Mana insuficiente para canalizar</span>
    </div>
  </div>
</div></body></html>
